name: CI

on: [push, pull_request]

jobs:
  ci:
    name: Run tests and deploy
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        build-docs: [false]
        deploy: [false]
        experimental: [false]
        include:
          - php-version: '8.5'
            build-docs: true
            deploy: ${{ github.ref == 'refs/heads/master' }}
            experimental: false
          - php-version: '8.6'
            build-docs: true
            deploy: false
            experimental: true
    steps:
      # Download code from repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: ast-stable

      # Setup Composer
      - name: Setup Composer
        run: composer validate --strict && composer install

      # Run static analyzer
      - name: Run static analyzer
        if: ${{ matrix.php-version != '7.1' }}
        run: vendor/bin/phan --allow-polyfill-parser --color --no-progress-bar

      # Run tests
      - name: Run tests
        run: vendor/bin/simple-phpunit --testdox

      # Build documentation
      - name: Build documentation
        if: ${{ matrix.build-docs }}
        run: |
          php ./scripts/build-docs.php
          docker run --rm -v ${PWD}:/docs squidfunk/mkdocs-material build

       # Deploy documentation
      - name: Deploy documentation
        if: ${{ matrix.deploy }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true  # Automatically remove deleted files from the deploy branch
